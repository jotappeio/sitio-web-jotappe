<!DOCTYPE html>
<html lang="es">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FG9R1TWNW9"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juan Pablo Díaz | Gestión de proyectos | Logística Outdoor | Profesional independiente</title>
    <style>
        :root { --accent: #8fbc8f; --bg: #050505; --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body { 
            background: var(--bg); 
            font-family: 'Inter', system-ui, sans-serif; 
            color: var(--text); 
            min-height: 100vh; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            padding: 30px 20px;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.85) 100%);
            z-index: 2; pointer-events: none;
        }

        /* FONDO FIJO LOCAL EN ALTA RESOLUCIÓN */
        .bg-fixed { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; opacity: 0.25; pointer-events: none; 
            background-color: #000;
            background-image: url('assets/hero-bg.jpg');
            background-size: cover; background-position: center;
            filter: grayscale(100%) contrast(120%);
        }

        .content { position: relative; z-index: 10; text-align: center; padding: 20px 0; max-width: 900px; margin: auto 0; }
        .logo-box { display: inline-block; font-weight: 900; font-size: 2.2rem; color: var(--accent); border: 3px solid var(--accent); padding: 5px 18px; border-radius: 12px; margin-bottom: 25px; user-select: none; }
        
        .name-label { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 7px; color: var(--accent); opacity: 0.9; margin-bottom: 20px; display: block; }
        h1 { font-size: clamp(2.2rem, 7.5vw, 5rem); font-weight: 900; letter-spacing: -3px; line-height: 0.9; margin-bottom: 20px; text-transform: uppercase; }
        .tagline { font-size: clamp(0.9rem, 2vw, 1.15rem); font-weight: 400; color: #ccc; letter-spacing: 2px; line-height: 1.6; max-width: 700px; margin: 0 auto 10px auto; text-transform: uppercase; }
        .status-tag { font-size: 0.75rem; font-weight: 300; color: #777; letter-spacing: 4px; text-transform: uppercase; display: block; margin-bottom: 15px; }
        
        /* CONTENEDOR Y BOTONES CTA */
        .cta-container { margin-top: 45px; margin-bottom: 45px; }
        .cta-group { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
        
        .btn-base { 
            display: inline-flex; align-items: center; justify-content: center; 
            gap: 12px;
            text-decoration: none; font-weight: 900; font-size: 0.85rem; 
            text-transform: uppercase; letter-spacing: 3px; 
            padding: 20px 40px; border-radius: 50px; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cv-btn { 
            color: #000; background: var(--accent); 
            border: 2px solid var(--accent);
            box-shadow: 0 10px 30px rgba(143, 188, 143, 0.3);
        }
        .cv-btn:hover { transform: scale(1.05) translateY(-3px); background: #fff; border-color: #fff; box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2); }

        .portfolio-btn { 
            color: var(--text); background: transparent; 
            border: 2px solid var(--accent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .btn-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }

        .portfolio-btn:hover { transform: scale(1.05) translateY(-3px); background: var(--accent); color: #000; box-shadow: 0 15px 40px rgba(143, 188, 143, 0.4); }
        .portfolio-btn:hover .btn-icon { transform: scale(1.1); }

        .social-box { margin-top: 35px; display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .social-link { color: #aaa; text-decoration: none; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px; transition: 0.3s; }
        .social-link:hover { color: var(--accent); transform: translateY(-2px); text-shadow: 0 0 15px rgba(143, 188, 143, 0.5); }

        .status-bar { width: 100%; text-align: center; font-size: 0.65rem; letter-spacing: 5px; color: #444; text-transform: uppercase; font-weight: 900; z-index: 10; margin-top: 30px; }

        @media (max-width: 600px) {
            .cta-group { flex-direction: column; gap: 15px; }
            .btn-base { width: 100%; max-width: 320px; padding: 18px 25px; }
            .social-box { gap: 20px; }
            .social-link { font-size: 0.8rem; letter-spacing: 2px; }
            .name-label { letter-spacing: 4px; font-size: 0.7rem; }
            .status-bar { letter-spacing: 3px; margin-top: 20px; }
            body { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <!-- Fondo con tu imagen local -->
    <div class="bg-fixed"></div>

        <h1>Rediseñando<br>el camino a la Cumbre</h1>
        
        <p class="tagline">Gestión de proyectos | Logística Outdoor</p>
        <span class="status-tag">Estructura Digital en Optimización</span>
        
        <div class="cta-container">
            <div class="cta-group">
                <a href="assets/CV_Juan_Pablo_Diaz.pdf" class="btn-base cv-btn" target="_blank">Descargar CV</a>
                <a href="https://lightroom.adobe.com/shares/95e85373e0d84fb59a4bf10bad1d22ce" class="btn-base portfolio-btn" target="_blank" rel="noopener noreferrer">
                    <svg class="btn-icon" viewBox="0 0 24 24">
                        <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
                    </svg>
                    Book Fotográfico
                </a>
            </div>
        </div>

        <div class="social-box">
            <a href="https://wa.me/56950005651" class="social-link" target="_blank">WhatsApp</a>
            <a href="https://www.linkedin.com/in/jotappecom" class="social-link" target="_blank">LinkedIn</a>
            <a href="https://www.instagram.com/jotappe.io/" class="social-link" target="_blank">Instagram</a>
        </div>
    </div>

    <div class="status-bar">
        CHILE // 2026
    </div>

</body>
</html>
